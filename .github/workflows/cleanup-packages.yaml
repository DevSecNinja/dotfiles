---
name: Cleanup Devcontainer Packages

# Prune stale, untagged devcontainer image versions from GHCR so the package
# does not grow unbounded.
#
# WHY THIS IS NEEDED:
#   Every main-branch / scheduled prebuild pushes two per-arch images BY DIGEST
#   and re-points :latest at the new pair (see devcontainer-prebuild.yaml). The
#   PREVIOUS per-arch digests are left behind as untagged versions and would
#   otherwise accumulate forever.
#
# WHY THIS IS SAFE:
#   .github/scripts/prune-untagged-images.sh (tests:
#   tests/bash/prune-untagged-images.bats) only deletes versions that are
#   untagged, older than the cut-off, and not referenced by a kept image. It
#   reads the manifest index of every tagged (:latest, :vX.Y.Z) and recent
#   version from ghcr.io and protects every per-arch CHILD manifest and
#   attestation it references (nested indexes included), plus registry-pushed
#   provenance whose subject is a kept image. It is fail-closed: if it cannot
#   read any manifest it deletes nothing. The cut-off keeps in-flight
#   builds/pulls safe, and GHCR keeps deleted versions restorable for 30 days.
#   Pull requests that change this workflow or the script run it as a dry run.
#
# TOKEN NOTE:
#   We authenticate with the built-in GITHUB_TOKEN, so the repository must
#   hold the `Admin` role on the package (Package settings -> Manage Actions
#   access).

on:
  schedule:
    # Weekly on Mondays at 02:00 UTC — after the 00:00 prebuild refresh so the
    # newest per-arch digests are already tagged into :latest before we prune.
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview deletions without removing anything'
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/cleanup-packages.yaml
      - .github/scripts/prune-untagged-images.sh

permissions:
  contents: read

jobs:
  cleanup:
    name: Prune untagged devcontainer digests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden runner
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/harden-runner@bf22fcfcb4ef94a359eed55cea4b5ce7f5b98167 # main

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prune untagged versions (multi-arch aware)
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: dotfiles-devcontainer
          CUT_OFF_DAYS: "7"
          # Pull requests always preview; only DRY_RUN=false deletes.
          DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry-run == true }}
        run: bash .github/scripts/prune-untagged-images.sh
