---
# Secret-scan caller that repo-steward adds to every repo without one (rule
# baseline/required-file#secret-scan, policy/baseline.toml [[files]]). It
# follows DevSecNinja/.github's own secret-scan-caller.yml: lint-include.yml,
# the thin variant of the reusable lint workflow where every linter is off
# unless set to true, with only gitleaks on. gitleaks scans the full git
# history on every event that isn't a pull request (DevSecNinja/.github#520),
# so new gitleaks
# rules re-check old commits. Findings stay private: public repos upload them
# to code scanning (category gitleaks/history) and log a count only; private
# repos list them in the job summary, which only collaborators can read.
# Pull requests are scanned by the lint caller (their own commits only).
# Renovate keeps the pin and the mise version current. When steward opens the
# PR, main becomes the repo's default branch.
name: Secret scan

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A scan that already started finishes; the next one queues.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    uses: DevSecNinja/.github/.github/workflows/lint-include.yml@231c380d4f75486e159ed2e3d806bc76ff193a43 # v4.7.0
    permissions:
      contents: read
      # Public repos: the history findings go to code scanning.
      security-events: write
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      mise-version: "2026.11.9"
      # History findings only report (warnings); this fails the run when the
      # scan or the code scanning upload fails, so a silent gap can't look
      # green. gitleaks must be pinned in the repo's .mise.toml.
      lint-fail-on-error: true
      # lint-include.yml runs no linter unless it is set to true.
      lint-gitleaks: true
