# mise configuration for dotfiles repository
# https://mise.jdx.dev/configuration.html

# Global tool versions used in this project
[tools]
# Python for validation scripts and tooling
python = "3.15.2"

# Go Task for task runner
task = "latest"

# Chezmoi for dotfile management
# renovate: datasource=github-releases depName=twpayne/chezmoi extractVersion=^v(?<version>.+)$
chezmoi = "2.74.0"

# Bats for bash testing
bats = "1.14.0"

# Lefthook for managing git hooks
lefthook = "latest"

# Shell linting and formatting (used by lefthook hooks and
# .github/workflows/lint.yml, which needs exact versions; Renovate keeps them current)
shellcheck = "0.11.0"
shfmt = "3.14.1"

# The other lint tools run by .github/workflows/lint.yml (Renovate keeps them current)
dprint = "0.64.3"
yamlfmt = "0.21.0"
actionlint = "1.7.12"
gitleaks = "8.30.1"
trivy = "0.76.2"
zizmor = "1.32.0"
"pipx:yamllint" = "1.38.0"
"pipx:checkov" = "3.4.3"

# Release tooling: cocogitto drives `cog bump`, git-cliff renders CHANGELOG.md
# and release notes. See cog.toml, cliff.toml, .github/workflows/release.yml.
cocogitto = "latest"
git-cliff = "latest"

# uv powers the pipx backend used for apm-cli below (mise shells out to
# `uv tool install`). Without uv declared, `mise install` fails with
# "No version is set for shim: uv".
uv = "latest"

# Agent Package Manager (APM): installs & updates AI agent primitives (prompts,
# instructions, skills) from APM packages such as DevSecNinja/ai-toolkit.
# Installed via the pipx backend (PyPI package `apm-cli`); the GitHub binary
# release is a PyInstaller bundle that mise's github/ubi backends extract
# incompletely, so pipx is the working install path.
# renovate: datasource=pypi depName=apm-cli
"pipx:apm-cli" = "0.35.0"

# Additional tools for development (commented out by default)
# Uncomment based on your needs
# node = "lts"
# go = "1.22"

# Environment variables
[env]
# Add mise bin directory to PATH
_.path = ["~/.local/share/mise/shims"]

# Python settings
PYTHONDONTWRITEBYTECODE = "1"  # Prevent .pyc files

# Aliases for common commands
[tool_alias]
# Upgrade all tools
upgrade = "mise upgrade"

# Settings for specific tools
[settings]
# Auto-activate mise when entering directory
experimental = true

# Legacy version file support (.python-version, .node-version, etc.)
legacy_version_file = true

# Verbose mode for debugging
verbose = false

# Tasks (experimental feature - complements Taskfile.yml)
# Uncomment to use mise tasks instead of or alongside go-task
# [tasks]
# [tasks.validate]
# description = "Run all validation checks"
# run = "./tests/bash/run-tests.sh --ci && lefthook run pre-commit --all-files"

# [tasks.test]
# description = "Run tests"
# run = "./tests/bash/run-tests.sh --ci"

# [tasks.install]
